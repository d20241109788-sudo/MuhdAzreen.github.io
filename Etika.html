<!DOCTYPE html>
<html lang="ms">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>The Ethical Whisperer: Classified Files</title>
    <style>
        :root { --neon-green: #00ff41; --dark-bg: #050505; --error-red: #ff3131; }
        body { background: var(--dark-bg); color: var(--neon-green); font-family: 'Courier New', Courier, monospace; overflow: hidden; margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; }
        
        /* Background Matrix Effect */
        #bg-canvas { position: fixed; top: 0; left: 0; z-index: -1; opacity: 0.15; }

        .container { border: 2px solid var(--neon-green); background: rgba(0, 0, 0, 0.9); padding: 40px; width: 600px; position: relative; box-shadow: 0 0 30px rgba(0, 255, 65, 0.2); }
        .glitch { font-size: 1.5em; font-weight: bold; text-align: center; margin-bottom: 20px; text-shadow: 2px 2px var(--dark-bg); animation: blink 1s infinite; }
        
        @keyframes blink { 0%, 100% { opacity: 1; } 50% { opacity: 0.5; } }

        input[type="text"] { background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); padding: 10px; width: 80%; display: block; margin: 20px auto; text-align: center; outline: none; }
        
        .btn { display: block; width: 100%; padding: 15px; margin: 15px 0; background: transparent; border: 1px solid var(--neon-green); color: var(--neon-green); cursor: pointer; font-size: 1em; transition: all 0.3s; text-transform: uppercase; letter-spacing: 2px; }
        .btn:hover { background: var(--neon-green); color: #000; box-shadow: 0 0 20px var(--neon-green); }

        .stats-bar { display: flex; justify-content: space-between; margin-top: 30px; font-size: 0.8em; opacity: 0.7; }
        #leaderboard { display: none; margin-top: 20px; border-top: 1px solid #333; padding-top: 10px; font-size: 0.8em; }
    </style>
</head>
<body>

<canvas id="bg-canvas"></canvas>

<div class="container" id="main-ui">
    <div id="setup-screen">
        <div class="glitch">SISTEM ETIKA KAUNSELING v3.0</div>
        <p style="text-align: center;">Sila masukkan ID Kaunselor anda untuk akses fail sulit:</p>
        <input type="text" id="player-name" placeholder="NAMA KAUNSELOR..." maxlength="15">
        <button class="btn" onclick="startGame()">MULA MISI</button>
    </div>

    <div id="game-screen" style="display:none;">
        <div id="level-indicator" style="font-size: 0.7em; margin-bottom: 10px;">FILE: CLASSIFIED_001</div>
        <div class="soalan-teks" id="soalan-teks" style="font-size: 1.2em; min-height: 100px;">Menganalisis data...</div>
        <div id="pilihan-container"></div>
        <div class="stats-bar">
            <span id="display-name">KAUNSELOR: ---</span>
            <span id="display-score">INTEGRITI: 0</span>
        </div>
    </div>
</div>

<script>
    // --- MATRIX BACKGROUND EFFECT ---
    const canvas = document.getElementById('bg-canvas');
    const ctx = canvas.getContext('2d');
    canvas.width = window.innerWidth;
    canvas.height = window.innerHeight;
    const letters = "ABCDEFGHIJKLMNOPQRSTUVWXYZ0123456789";
    const fontSize = 16;
    const columns = canvas.width / fontSize;
    const drops = Array(Math.floor(columns)).fill(1);

    function drawMatrix() {
        ctx.fillStyle = "rgba(0, 0, 0, 0.05)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        ctx.fillStyle = "#0F0";
        for (let i = 0; i < drops.length; i++) {
            const text = letters.charAt(Math.floor(Math.random() * letters.length));
            ctx.fillText(text, i * fontSize, drops[i] * fontSize);
            if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) drops[i] = 0;
            drops[i]++;
        }
    }
    setInterval(drawMatrix, 33);

    // --- GAME LOGIC ---
    let playerName = "";
    let score = 0;
    let currentLevel = 0;
    let poolSoalan = [
        { q: "Klien mengaku mencuri coklat. Adakah anda lapor?", a: ["Simpan rahsia", "Lapor polis", "Beritahu keluarga"], c: "Simpan rahsia" },
        { q: "Klien beri hadiah mewah jam Rolex.", a: ["Tolak sopan", "Terima", "Derma"], c: "Tolak sopan" },
        { q: "Kawan karib mahu jadi klien anda.", a: ["Tolak (Dual Role)", "Terima", "Terima (Caj diskaun)"], c: "Tolak (Dual Role)" },
        { q: "Klien mahu bunuh jiran malam ini.", a: ["Lapor (Duty to Warn)", "Simpan rahsia", "Nasihat sahaja"], c: "Lapor (Duty to Warn)" },
        { q: "Anda mahu rakam sesi secara rahsia.", a: ["Minta izin bertulis", "Rakam senyap", "Jangan rakam"], c: "Minta izin bertulis" },
        { q: "Laptop berisi nota klien dicuri.", a: ["Lapor breach data", "Diamkan", "Ganti baru"], c: "Lapor breach data" },
        { q: "Klien tidak maju selepas 2 tahun.", a: ["Tamatkan & Rujuk", "Teruskan sesi", "Biarkan klien"], c: "Tamatkan & Rujuk" },
        { q: "Terjumpa FB klien secara tidak sengaja.", a: ["Abaikan privasi", "Lihat profil", "Block klien"], c: "Abaikan privasi" },
        { q: "Klien remaja hamil dan mahu rahsiakannya.", a: ["Galak beritahu penjaga", "Lapor polis", "Paksa beritahu"], c: "Galak beritahu penjaga" },
        { q: "Majikan minta nota sulit klien.", a: ["Minimum info (izin)", "Bagi semua", "Tolak keras"], c: "Minimum info (izin)" },
        { q: "Jatuh cinta pada klien.", a: ["Rujuk penyelia", "Luah perasaan", "Teruskan sesi"], c: "Rujuk penyelia" },
        { q: "Guna gambar klien untuk poster.", a: ["Tidak dibenarkan", "Boleh (izin)", "Guna emoji"], c: "Tidak dibenarkan" },
        { q: "Nilai klien bercanggah dengan agama anda.", a: ["Kekal neutral", "Paksa nilai anda", "Hina klien"], c: "Kekal neutral" },
        { q: "Bekas klien 5 tahun lepas ajak dating.", a: ["Boleh (ikut tempoh)", "Tak boleh selamanya", "Boleh (dia belanja)"], c: "Boleh (ikut tempoh)" },
        { q: "Kes trauma di luar kepakaran anda.", a: ["Rujuk pakar", "Cuba sendiri", "Abaikan"], c: "Rujuk pakar" }
    ];

    function shuffle(arr) {
        for (let i = arr.length - 1; i > 0; i--) {
            const j = Math.floor(Math.random() * (i + 1));
            [arr[i], arr[j]] = [arr[j], arr[i]];
        }
        return arr;
    }

    function startGame() {
        playerName = document.getElementById('player-name').value.trim();
        if (!playerName) { alert("Sila masukkan ID Kaunselor!"); return; }
        
        document.getElementById('setup-screen').style.display = "none";
        document.getElementById('game-screen').style.display = "block";
        document.getElementById('display-name').innerText = "KAUNSELOR: " + playerName;
        
        poolSoalan = shuffle(poolSoalan); // Shuffle Soalan
        loadLevel();
    }

    function loadLevel() {
        if (currentLevel >= 15) { endGame(); return; }
        
        const data = poolSoalan[currentLevel];
        document.getElementById('level-indicator').innerText = "FILE: CLASSIFIED_00" + (currentLevel + 1);
        document.getElementById('soalan-teks').innerText = data.q;
        
        const container = document.getElementById('pilihan-container');
        container.innerHTML = "";
        
        let shuffledAnswers = shuffle([...data.a]); // Shuffle Jawapan
        shuffledAnswers.forEach(ans => {
            const b = document.createElement('button');
            b.className = "btn";
            b.innerText = ans;
            b.onclick = () => check(ans, data.c);
            container.appendChild(b);
        });
    }

    function check(ans, correct) {
        if (ans === correct) { score++; }
        currentLevel++;
        document.getElementById('display-score').innerText = "INTEGRITI: " + score;
        loadLevel();
    }

    function endGame() {
        let rank = score >= 13 ? "MASTER COUNSELOR" : "TRAINEE";
        document.getElementById('game-screen').innerHTML = `
            <div class="glitch">MISI TAMAT</div>
            <p style="text-align:center">EJEN: ${playerName}<br>SKOR INTEGRITI: ${score}/15<br>RANK: ${rank}</p>
            <button class="btn" onclick="location.reload()">REBOOT SYSTEM</button>
            <div id="leaderboard">
                <p>REKOD TEMPATAN (Terbaru):</p>
                <div id="score-list"></div>
            </div>
        `;
        saveScore(playerName, score);
    }

    function saveScore(name, scr) {
        let scores = JSON.parse(localStorage.getItem('ethicsScores') || "[]");
        scores.push({name, scr, date: new Date().toLocaleDateString()});
        scores.sort((a,b) => b.scr - a.scr);
        localStorage.setItem('ethicsScores', JSON.stringify(scores.slice(0, 5))); // Simpan Top 5
        
        document.getElementById('leaderboard').style.display = "block";
        let list = document.getElementById('score-list');
        scores.slice(0, 5).forEach(s => {
            list.innerHTML += `<div>${s.name} - ${s.scr}/15 (${s.date})</div>`;
        });
    }

    // ... kod sedia ada ...

    function check(ans, correct) {
        if (ans === correct) { score++; }
        currentLevel++;
        
        // Kira peratus semasa
        let peratusSemasa = Math.round((score / 15) * 100);
        document.getElementById('display-score').innerText = "INTEGRITI: " + peratusSemasa + "%";
        
        loadLevel();
    }

    function endGame() {
        let peratusAkhir = Math.round((score / 15) * 100);
        let rank = "";
        let warna = "";

        if(peratusAkhir >= 80) { rank = "MASTER COUNSELOR"; warna = "#00ff41"; }
        else if(peratusAkhir >= 50) { rank = "TRAINEE"; warna = "yellow"; }
        else { rank = "SUSPENDED"; warna = "red"; }

        document.getElementById('game-screen').innerHTML = `
            <div class="glitch">MISI TAMAT</div>
            <p style="text-align:center">KAUNSELOR: ${playerName}<br>
            TAHAP INTEGRITI: <span style="color:${warna}; font-size:1.5em;">${peratusAkhir}%</span><br>
            STATUS: ${rank}</p>
            <button class="btn" onclick="location.reload()">REBOOT SYSTEM</button>
            <div id="leaderboard">
                <p>REKOD TERBARU:</p>
                <div id="score-list"></div>
            </div>
        `;
        saveScore(playerName, peratusAkhir);
    }

    function saveScore(name, peratus) {
        let scores = JSON.parse(localStorage.getItem('ethicsScores') || "[]");
        scores.push({name, peratus, date: new Date().toLocaleDateString()});
        scores.sort((a,b) => b.peratus - a.peratus);
        localStorage.setItem('ethicsScores', JSON.stringify(scores.slice(0, 5)));
        
        document.getElementById('leaderboard').style.display = "block";
        let list = document.getElementById('score-list');
        scores.slice(0, 5).forEach(s => {
            list.innerHTML += `<div>${s.name} - ${s.peratus}% (${s.date})</div>`;
        });
    }
</script>
</body>
</html>
